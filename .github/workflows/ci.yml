name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck
        run: uv run pyright
      - name: Tests
        run: uv run pytest -q

  evals:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Replay evals (stub)
        run: echo "Replay evals arrive in M3 (uv run python -m evals.run --suite all --mode replay)"
