[project]
name = "voice-agent"
version = "0.1.0"
description = "Real-time voice agent for table reservations and menu/allergen questions."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pipecat-ai[google,groq]>=1.14,<2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "tzdata>=2026.5",
]

[project.scripts]
voice-agent = "voice_agent.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src/voice_agent/domain"]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: tests touching local resources (DB, files); never the network"]
